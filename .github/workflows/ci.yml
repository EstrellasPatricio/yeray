name: Build and test frontend and backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend-yeray/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend-yeray/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  backend:
    name: Backend (Fastify)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  frontend:
    name: Frontend (WXT + React)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend-yeray

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: frontend-yeray/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run compile

      - name: Lint
        run: pnpm run lint

      - name: Build extension
        run: pnpm run build

      - name: Test
        run: pnpm test
