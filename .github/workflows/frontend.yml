name: Frontend CI

on:
  push:
    branches:
      - main
    paths:
      - 'frontend-yeray/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'frontend-yeray/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (WXT + React)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend-yeray

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: frontend-yeray/pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run compile

      - name: Lint
        run: pnpm run lint --if-present

      - name: Compilar extension
        run: pnpm run build

      - name: Tests
        run: pnpm test --if-present
